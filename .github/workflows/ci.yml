name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-features

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          log-level: warn
          command: check all

  gitignore:
    name: gitignore-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that secrets paths are gitignored
        run: |
          git check-ignore -q secrets/telegram_bot_token || (echo "❌ secrets/telegram_bot_token not in .gitignore"; exit 1)
          git check-ignore -q secrets/paperclip_token || (echo "❌ secrets/paperclip_token not in .gitignore"; exit 1)
          echo "✓ All secrets paths are correctly ignored"

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create placeholder files
        run: |
          mkdir -p secrets .env-placeholder
          echo "placeholder-not-a-secret" > secrets/paperclip_token
          echo "placeholder-not-a-secret" > secrets/telegram_bot_token
          touch .env
      - name: Validate both compose files
        run: |
          docker compose -f deploy/compose.example.yml config --format json > /tmp/isolated.json
          docker compose -f deploy/compose.host-network.example.yml config --format json > /tmp/host.json
          echo "✓ Both compose files validate"
      - name: Compare hardening
        run: |
          ISOLATED=$(docker compose -f deploy/compose.example.yml config --format json | jq '.services.bridge | {restart, read_only, user, cap_drop, security_opt, tmpfs, stop_grace_period}')
          HOST=$(docker compose -f deploy/compose.host-network.example.yml config --format json | jq '.services.bridge | {restart, read_only, user, cap_drop, security_opt, tmpfs, stop_grace_period}')
          if [ "$ISOLATED" != "$HOST" ]; then
            echo "❌ Hardening differs between compose files"
            echo "Isolated: $ISOLATED"
            echo "Host:     $HOST"
            exit 1
          fi
          echo "✓ Hardening identical"
      - name: Verify tmpfs in both files
        run: |
          if ! docker compose -f deploy/compose.example.yml config --format json | jq '.services.bridge.tmpfs[]' | grep -q "/tmp"; then
            echo "❌ tmpfs /tmp not in compose.example.yml"
            exit 1
          fi
          if ! docker compose -f deploy/compose.host-network.example.yml config --format json | jq '.services.bridge.tmpfs[]' | grep -q "/tmp"; then
            echo "❌ tmpfs /tmp not in compose.host-network.example.yml"
            exit 1
          fi
          echo "✓ tmpfs /tmp in both files"
      - name: Verify host-network config
        run: |
          CONFIG=$(docker compose -f deploy/compose.host-network.example.yml config --format json)
          if [ "$(echo "$CONFIG" | jq -r '.services.bridge.network_mode')" != "host" ]; then
            echo "❌ network_mode should be 'host'"
            exit 1
          fi
          if echo "$CONFIG" | jq '.services.bridge | has("networks")' | grep -q true; then
            echo "❌ networks should not be defined"
            exit 1
          fi
          if echo "$CONFIG" | jq '.services.bridge | has("ports")' | grep -q true; then
            echo "❌ ports should not be defined"
            exit 1
          fi
          echo "✓ Host-network config correct"

  rootless-secrets:
    name: rootless-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run rootless Docker secrets test
        run: bash scripts/secrets-rootless-test.sh

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: paperclip-telegram-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run smoke tests
        run: bash scripts/docker-smoke.sh
