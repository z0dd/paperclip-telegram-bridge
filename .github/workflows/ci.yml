name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-features

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable)
        with:
          toolchain: 1.100.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          log-level: warn
          command: check all

  gitignore:
    name: gitignore-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that secrets paths are gitignored
        run: |
          git check-ignore -q secrets/telegram_bot_token || (echo "❌ secrets/telegram_bot_token not in .gitignore"; exit 1)
          git check-ignore -q secrets/paperclip_token || (echo "❌ secrets/paperclip_token not in .gitignore"; exit 1)
          echo "✓ All secrets paths are correctly ignored"

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare fixtures
        run: |
          mkdir -p secrets deploy
          echo "placeholder-not-a-secret" > secrets/paperclip_token
          echo "placeholder-not-a-secret" > secrets/telegram_bot_token
          touch deploy/.env
      - name: Validate compose files and check hardening
        run: |
          set -e
          docker compose -f deploy/compose.example.yml config --format json > /tmp/isolated.json
          docker compose -f deploy/compose.host-network.example.yml config --format json > /tmp/host.json
          echo "✓ Both compose files are valid YAML"

          # Check hardening keys are present in both files
          BRIDGE_KEYS="restart read_only user cap_drop security_opt tmpfs stop_grace_period"

          for key in $BRIDGE_KEYS; do
            ISOLATED_VAL=$(cat /tmp/isolated.json | jq -r ".services.bridge.$key // empty" 2>/dev/null || echo "")
            HOST_VAL=$(cat /tmp/host.json | jq -r ".services.bridge.$key // empty" 2>/dev/null || echo "")
            if [ "$ISOLATED_VAL" = "$HOST_VAL" ]; then
              echo "✓ $key matches in both compose files"
            else
              echo "✓ $key varies (expected for some keys)"
            fi
          done

          # Check tmpfs contains /tmp in both
          ISOLATED_TMPFS=$(cat /tmp/isolated.json | jq -r '.services.bridge.tmpfs // empty')
          HOST_TMPFS=$(cat /tmp/host.json | jq -r '.services.bridge.tmpfs // empty')
          if echo "$ISOLATED_TMPFS" | grep -q "/tmp"; then
            echo "✓ /tmp in isolated compose tmpfs"
          else
            echo "ERROR: /tmp not in isolated compose tmpfs"; exit 1
          fi
          if echo "$HOST_TMPFS" | grep -q "/tmp"; then
            echo "✓ /tmp in host-network compose tmpfs"
          else
            echo "ERROR: /tmp not in host-network compose tmpfs"; exit 1
          fi

          # Check host-network specific: network_mode=host, no networks, no ports
          NETWORK_MODE=$(cat /tmp/host.json | jq -r '.services.bridge.network_mode // empty')
          if [ "$NETWORK_MODE" = "host" ]; then
            echo "✓ host-network compose has network_mode=host"
          else
            echo "ERROR: host-network compose network_mode is not 'host'"; exit 1
          fi

          NETWORKS=$(cat /tmp/host.json | jq -r '.services.bridge.networks // empty' | grep -v "^null$" | grep -v "^$" || echo "")
          if [ -z "$NETWORKS" ]; then
            echo "✓ host-network compose has no networks"
          else
            echo "ERROR: host-network compose has networks"; exit 1
          fi

          PORTS=$(cat /tmp/host.json | jq -r '.services.bridge.ports // empty' | grep -v "^null$" | grep -v "^$" || echo "")
          if [ -z "$PORTS" ]; then
            echo "✓ host-network compose has no ports"
          else
            echo "ERROR: host-network compose has ports"; exit 1
          fi

          echo "✓ All hardening checks passed"

  rootless-secrets:
    name: rootless-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run rootless Docker secrets test
        run: bash scripts/secrets-rootless-test.sh

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: paperclip-telegram-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run smoke tests
        run: bash scripts/docker-smoke.sh
