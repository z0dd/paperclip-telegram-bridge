name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7f3bb38ab854a3a72d1e21a8b # v4.1.6
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075fab17d2c03c6d76fbf # v2.7.3
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7f3bb38ab854a3a72d1e21a8b # v4.1.6
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075fab17d2c03c6d76fbf # v2.7.3
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7f3bb38ab854a3a72d1e21a8b # v4.1.6
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075fab17d2c03c6d76fbf # v2.7.3
      - run: cargo test --all-features

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7f3bb38ab854a3a72d1e21a8b # v4.1.6
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075fab17d2c03c6d76fbf # v2.7.3
      - uses: EmbarkStudios/cargo-deny-action@e0a440755b1184c2881d4701de888da5669f24ca # v1.1.12

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7f3bb38ab854a3a72d1e21a8b # v4.1.6
      - uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa601d98bc5c1a # v3.0.0
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.2.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
